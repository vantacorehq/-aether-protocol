<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#555555"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Abstract Global Mesh / Neural Net -->
  <g stroke="#333333" stroke-width="1.5" fill="none" opacity="0.7">
    <polygon points="950,200 1050,100 1150,200 1050,300" />
    <polygon points="950,200 850,150 850,250" />
    <line x1="950" y1="200" x2="1150" y2="200" stroke="#ffffff" stroke-width="1" filter="url(#glow)" opacity="0.5"/>
    <line x1="850" y1="150" x2="1050" y2="100" stroke="#555555" stroke-dasharray="3 3"/>
    <line x1="850" y1="250" x2="1050" y2="300" stroke="#555555" stroke-dasharray="3 3"/>
    
    <circle cx="950" cy="200" r="5" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="1050" cy="100" r="3" fill="#888888" />
    <circle cx="1150" cy="200" r="4" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="1050" cy="300" r="3" fill="#888888" />
    <circle cx="850" cy="150" r="3" fill="#888888" />
    <circle cx="850" cy="250" r="3" fill="#888888" />
  </g>

  <!-- Massive Typography -->
  <text x="80" y="220" font-family="monospace, sans-serif" font-size="120" font-weight="900" fill="url(#textGrad)" letter-spacing="10">AETHER</text>
  
  <!-- Subtitle -->
  <text x="85" y="260" font-family="monospace, sans-serif" font-size="20" fill="#aaaaaa" letter-spacing="6">THE GLOBAL DECENTRALIZED SUPERCOMPUTER</text>
  
  <!-- Status Bar -->
  <rect x="80" y="290" width="400" height="2" fill="#333333"/>
  <text x="85" y="315" font-family="monospace, sans-serif" font-size="12" fill="#666666">PROTOCOL: ACTIVE // NODES: 10,482,991 // COMPUTE: EXASCALE</text>
  <text x="85" y="335" font-family="monospace, sans-serif" font-size="12" fill="#444444">NO CLOUD. NO LIMITS. NO SINGLE POINT OF FAILURE.</text>
  
  <text x="1000" y="360" font-family="monospace, sans-serif" font-size="12" fill="#333333">VANTACORE HQ © 2024</text>
</svg>
