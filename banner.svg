<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A"/>
      <stop offset="50%" stop-color="#0B1021"/>
      <stop offset="100%" stop-color="#1A0B2E"/>
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>

    <!-- Sphere Gradient -->
    <radialGradient id="coreSphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="1"/>
      <stop offset="50%" stop-color="#8A2BE2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#02040A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Abstract Data Streams (Background) -->
  <g opacity="0.1" stroke="#00FFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Central Supercomputer Core (3D Sphere Effect) -->
  <circle cx="950" cy="200" r="180" fill="url(#coreSphere)" opacity="0.6"/>
  
  <!-- Orbital Rings / P2P Mesh -->
  <g fill="none" stroke="#00FFFF" stroke-width="1.5" opacity="0.6" filter="url(#neonGlow)">
    <ellipse cx="950" cy="200" rx="200" ry="60" transform="rotate(30 950 200)" />
    <ellipse cx="950" cy="200" rx="200" ry="60" transform="rotate(-30 950 200)" />
    <ellipse cx="950" cy="200" rx="200" ry="60" transform="rotate(90 950 200)" />
  </g>
  
  <!-- Data Nodes -->
  <g fill="#FFFFFF" filter="url(#neonGlow)">
    <circle cx="950" cy="200" r="6" />
    <circle cx="1120" cy="250" r="4" />
    <circle cx="800" cy="120" r="4" />
    <circle cx="880" cy="320" r="3" fill="#8A2BE2"/>
    <circle cx="1050" cy="80" r="3" fill="#00FFFF"/>
    <circle cx="1150" cy="150" r="3" fill="#8A2BE2"/>
  </g>
  
  <!-- Connecting Lines -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.4">
    <line x1="950" y1="200" x2="1120" y2="250" />
    <line x1="950" y1="200" x2="800" y2="120" />
    <line x1="950" y1="200" x2="880" y2="320" />
    <line x1="950" y1="200" x2="1050" y2="80" />
    <line x1="950" y1="200" x2="1150" y2="150" />
  </g>

  <!-- Typography -->
  <!-- Huge Background Text -->
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="180" font-weight="900" fill="#FFFFFF" opacity="0.03" letter-spacing="20">AETHER</text>
  
  <!-- Main Foreground Text -->
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="110" font-weight="900" fill="url(#textGrad)" letter-spacing="12" filter="url(#neonGlow)">AETHER</text>
  
  <!-- Subtitle -->
  <text x="85" y="260" font-family="Courier New, monospace" font-size="16" fill="#00FFFF" letter-spacing="8" opacity="0.8">THE GLOBAL DECENTRALIZED SUPERCOMPUTER</text>
  
  <!-- Terminal UI Elements (Bottom) -->
  <g transform="translate(85, 300)">
    <rect x="0" y="0" width="400" height="1" fill="#00FFFF" opacity="0.3"/>
    <text x="0" y="20" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF" opacity="0.6">> STATUS: <tspan fill="#00FFFF">ONLINE</tspan></text>
    <text x="0" y="40" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF" opacity="0.6">> NODES: <tspan fill="#00FFFF">10,482,991</tspan></text>
    <text x="0" y="60" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF" opacity="0.6">> COMPUTE: <tspan fill="#8A2BE2">EXASCALE</tspan></text>
  </g>

  <!-- Top Right Status Bar -->
  <g transform="translate(900, 30)" opacity="0.7">
    <rect x="0" y="0" width="200" height="4" fill="#00FFFF" />
    <rect x="0" y="8" width="150" height="2" fill="#8A2BE2" />
    <rect x="0" y="12" width="100" height="2" fill="#FFFFFF" opacity="0.3"/>
  </g>

  <!-- Branding -->
  <text x="1080" y="380" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF" opacity="0.3" text-anchor="end">VANTACORE © 2024</text>
</svg>
